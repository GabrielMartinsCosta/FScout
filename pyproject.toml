[project]
name = "fscout"
version = "0.1.0"
description = "Ferramenta de scouting e analise granular de atletas de futebol a partir de dados evento-a-evento"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "plotly>=5.22",
    "dash>=2.17",
    "dash-bootstrap-components>=1.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
fscout = "fscout.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Porte fiel do validador de paleta: os caracteres Unicode que o ruff marca como
# ambiguos sao deliberados e nao podem ser trocados. A classe WS_RUN precisa conter
# exatamente os mesmos caracteres de espaco do original (NBSP, EN QUAD, separadores
# de linha e paragrafo) porque e ela que define a fronteira de entrada; trocar "×"
# por "x" ou "–" por "-" mudaria o texto do relatorio, que existe justamente para
# ser comparado com a saida do script original em JavaScript.
"scripts/validate_palette.py" = ["RUF001", "RUF002", "RUF003"]
# O teste da fronteira de entrada precisa conter os proprios caracteres de espaco
# incomuns que verifica: trocá-los por espaco comum apagaria o que o teste testa.
"tests/test_palette_validator.py" = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: baixa dados reais da StatsBomb Open Data (usa o cache local)"]

[tool.mypy]
python_version = "3.11"
packages = ["fscout"]
mypy_path = "src"
ignore_missing_imports = true
